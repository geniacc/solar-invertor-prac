name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build

    - name: Inspect built index and asset list
      run: |
        echo "--- dist/index.html head ---"
        head -n 40 dist/index.html || true
        echo "--- dist/assets ---"
        ls -lah dist/assets || true

    - name: Fail if legacy subpath references exist
      run: |
        if grep -R -q "/solar-invertor-prac" dist; then
          echo "ERROR: Found legacy subpath references in built output";
          exit 1;
        else
          echo "OK: No legacy subpath references detected";
        fi
      
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_branch: gh-pages
        publish_dir: ./dist
        force_orphan: true
        cname: zuice.in